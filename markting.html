<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>أساسيات التسويق الرقمي</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <!-- شعار جوجل -->
        <div class="logo-container">
            <img src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_272x92dp.png" alt="Google Logo" class="logo">
        </div>

        <!-- محتوى بطاقة اسم النطاق -->
        <section class="card">
            <h2>اسم النطاق</h2>
            <p>
                لحسن الحظ، كل ما عليك فعله هو اختيار اسم أفضل للإشارة إلى عنوان IP الرقمي. يُعرف هذا العنوان باسم موقعك الإلكتروني أو "اسم النطاق"، وهو الطريقة التي يجدك بها العملاء المحتملون. وهو ما تكتبه في نافذة المتصفح للوصول إلى أي موقع، مثل:
            </p>
            <a href="https://www.google.com" target="_blank" class="domain-link">www.google.com</a>
        </section>
    </main>

    <footer class="footer">
        <p>2025 Google | خاص وسري</p>
    </footer>

</body>
</html>
